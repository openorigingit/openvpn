# Example systemd drop-in for an OpenVPN server instance that supervises the
# experimental IKEv2 helper.
#
# Install as an instance-specific drop-in only after validating required paths,
# capabilities, and OpenVPN options for the deployment:
#
#   /etc/systemd/system/openvpn-server@NAME.service.d/ikev2-hardening.conf
#
# The helper is still supervised by OpenVPN. These settings constrain the
# OpenVPN service boundary that owns helper launch, IPC, XFRM leases, and
# firewall mutation.

[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=yes
ProtectControlGroups=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
PrivateDevices=no

ReadWritePaths=/run/openvpn /var/lib/openvpn
RuntimeDirectory=openvpn
StateDirectory=openvpn

CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_BIND_SERVICE CAP_SETGID CAP_SETUID
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_BIND_SERVICE
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
SystemCallArchitectures=native
SystemCallFilter=@system-service @network-io

# Add deployment-specific nftables, helper runtime, certificate, CRL, and audit
# paths. Do not mount the Docker socket or cloud control-plane credentials into
# this service.
